[general]
import = [
    "~/.config/alacritty/themes/themes/github_dark_dimmed.toml"
]

[window]
dimensions = { columns = 128, lines = 31 }
opacity = 0.99
padding.x = 10
padding.y = 10
decorations = "Full"
decorations_theme_variant = "Dark"

[font]
normal = { family = "JetBrains Maple Mono", style = "Regular" }
bold = { family = "JetBrains Maple Mono", style = "Bold" }
italic = { family = "JetBrains Maple Mono", style = "Italic" }
bold_italic = { family = "JetBrains Maple Mono", style = "Bold Italic" }
size = 11.0

[scrolling]
history = 100000
